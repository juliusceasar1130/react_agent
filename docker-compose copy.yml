services:
  # FastAPI 后端服务
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rearch-agent-backend
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    # 加入已存在的network，与postgres容器通信
    networks:
      - app-network
    restart: unless-stopped
    extra_hosts: -"localhost:172.22.44.99"

# 使用外部已存在的network（由postgres的docker-compose创建）
networks:
  app-network:
    external: true
    name: savedatabase_app_network
