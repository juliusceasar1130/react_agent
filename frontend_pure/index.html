<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天管理系统</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- 侧边栏：会话列表 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>聊天会话</h2>
                <button id="newSessionBtn" class="btn-new">+ 新建</button>
            </div>
            <div id="sessionList" class="session-list">
                <!-- 会话列表动态生成 -->
            </div>
        </aside>

        <!-- 主区域：聊天内容 -->
        <main class="main">
            <div id="chatContainer" class="chat-container">
                <div class="chat-header">
                    <span id="chatTitle">选择一个会话</span>
                    <button id="deleteSessionBtn" class="btn-delete" style="display: none;">删除会话</button>
                </div>
                <div id="messageList" class="message-list">
                    <!-- 消息列表动态生成 -->
                </div>
                <div class="input-area">
                    <textarea id="messageInput" placeholder="输入消息..." rows="3"></textarea>
                    <button id="sendBtn" class="btn-send">发送</button>
                </div>
            </div>
            <div id="emptyState" class="empty-state">
                <p>请选择或创建一个会话开始聊天</p>
            </div>
        </main>
    </div>

    <script src="main.js"></script>
</body>
</html>
